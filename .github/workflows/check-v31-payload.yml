name: Check v3.1 payload

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Reconstruct and inspect payload
        shell: bash
        run: |
          set -euo pipefail
          ls -l .agent-v31/chunk-*
          cat .agent-v31/chunk-* > /tmp/v31.b64
          base64 --decode /tmp/v31.b64 > /tmp/v31.zip
          sha256sum /tmp/v31.zip
          unzip -t /tmp/v31.zip
          unzip -l /tmp/v31.zip | tail -n 3
