name: Assemble v30 payload

on:
  push:
    branches:
      - agent/stage-solidfreecad-v30-payload
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          test -f .agent-payload/READY
          cat .agent-payload/chunk-* > /tmp/v30.b64
          base64 --decode /tmp/v30.b64 > /tmp/v30.zip
          echo '6e214c5115e476c3656863552b7a302d805f49513d28f7806a0b959dcfd6de6c  /tmp/v30.zip' | sha256sum -c -
          unzip -o /tmp/v30.zip -d .
          rm -rf .agent-payload
          rm -f .github/workflows/apply-v30-payload.yml
          test -f app/src/main/java/com/example/faceui/V30StepSessionUi.kt
          test -f docs/V30_STEP_TOUCH_WORKFLOW.md
          grep -q '3.0.0-step-session-a1' app/build.gradle.kts
      - name: Commit assembled revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Assemble adaptive STEP editing payload'
          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin HEAD:"${TARGET_BRANCH}"
