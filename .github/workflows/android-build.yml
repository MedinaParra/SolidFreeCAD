name: Android build

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  FREECAD_BASE_RUNTIME_RUN: 29699041993
  FREECAD_BASE_RUNTIME_ARTIFACT: freecad-android-base-runtime-v0110-apk
  FREECAD_FILES_RUNTIME_RUN: 29699041982
  FREECAD_FILES_RUNTIME_ARTIFACT: freecad-android-fcmacro-fcstd-apk
  FREECAD_BASE_RUNTIME_COMMIT: 1f70422ebaf60861971086709352d50716304625

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 and ELF tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Download validated FreeCAD Base runtime 0.11
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FREECAD_BASE_RUNTIME_ARTIFACT }}
          path: .deps/freecad-base-runtime
          repository: MedinaParra/FreeCAD-Native
          run-id: ${{ env.FREECAD_BASE_RUNTIME_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download validated FCStd native bridge
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FREECAD_FILES_RUNTIME_ARTIFACT }}
          path: .deps/freecad-files-runtime
          repository: MedinaParra/FreeCAD-Native
          run-id: ${{ env.FREECAD_FILES_RUNTIME_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and package ARM32 plus ARM64 runtimes
        shell: bash
        run: |
          set -euo pipefail
          BASE_APK="$(find .deps/freecad-base-runtime -type f -name '*.apk' | head -n 1)"
          BASE_HASH="$(find .deps/freecad-base-runtime -type f -name '*.apk.sha256' | head -n 1)"
          FILES_APK="$(find .deps/freecad-files-runtime -type f -name '*.apk' | head -n 1)"
          FILES_HASH="$(find .deps/freecad-files-runtime -type f -name '*.apk.sha256' | head -n 1)"
          test -n "${BASE_APK}" && test -n "${BASE_HASH}"
          test -n "${FILES_APK}" && test -n "${FILES_HASH}"
          (cd "$(dirname "${BASE_APK}")" && sha256sum -c "$(basename "${BASE_HASH}")")
          (cd "$(dirname "${FILES_APK}")" && sha256sum -c "$(basename "${FILES_HASH}")")

          rm -rf .build/native-runtime .build/files-runtime app/src/main/jniLibs \
            app/src/main/assets/python-runtime app/src/main/assets/licenses
          mkdir -p .build/native-runtime .build/files-runtime app/src/main/jniLibs \
            app/src/main/assets/python-runtime app/src/main/assets/licenses

          unzip -q "${BASE_APK}" \
            'lib/armeabi-v7a/*' \
            'lib/arm64-v8a/*' \
            'assets/python-runtime/armeabi-v7a.zip' \
            'assets/python-runtime/arm64-v8a.zip' \
            'assets/licenses/FreeCAD-LGPL-2.1.txt' \
            -d .build/native-runtime
          unzip -q "${FILES_APK}" \
            'lib/armeabi-v7a/libfreecad_android_core.so' \
            'lib/arm64-v8a/libfreecad_android_core.so' \
            -d .build/files-runtime

          for ABI in armeabi-v7a arm64-v8a; do
            mkdir -p "app/src/main/jniLibs/${ABI}"
            cp .build/native-runtime/lib/${ABI}/*.so "app/src/main/jniLibs/${ABI}/"
            cp ".build/native-runtime/assets/python-runtime/${ABI}.zip" \
              "app/src/main/assets/python-runtime/${ABI}.zip"

            cp ".build/files-runtime/lib/${ABI}/libfreecad_android_core.so" \
              "app/src/main/jniLibs/${ABI}/libfreecad_files_core.so"
            patchelf --set-soname libfreecad_files_core.so \
              "app/src/main/jniLibs/${ABI}/libfreecad_files_core.so"

            BASE_CORE="app/src/main/jniLibs/${ABI}/libfreecad_android_core.so"
            FILES_CORE="app/src/main/jniLibs/${ABI}/libfreecad_files_core.so"
            test -f "${BASE_CORE}"
            test -f "${FILES_CORE}"
            test -f "app/src/main/jniLibs/${ABI}/libTKDESTEP.so"
            test -f "app/src/main/jniLibs/${ABI}/libpython3.14.so"
            test -f "app/src/main/assets/python-runtime/${ABI}.zip"

            nm -D --defined-only "${BASE_CORE}" \
              | grep -q 'Java_com_medinaparra_freecadandroid_nativebridge_FreeCadBaseBridge_nativeSelfTest'
            nm -D --defined-only "${BASE_CORE}" \
              | grep -q 'Java_com_medinaparra_freecadandroid_nativebridge_NativeCadBridge_nativeRunMacro'
            nm -D --defined-only "${BASE_CORE}" \
              | grep -q 'Java_com_medinaparra_freecadandroid_nativebridge_NativeStepBridge_nativeImportStep'
            nm -D --defined-only "${FILES_CORE}" \
              | grep -q 'Java_com_medinaparra_freecadandroid_nativebridge_NativeFreeCadFileBridge_nativeImportBrepFiles'
            nm -D --defined-only "${FILES_CORE}" \
              | grep -q 'Java_com_medinaparra_freecadandroid_nativebridge_NativeFreeCadFileBridge_nativeImportBrepObjects'
            readelf -d "${FILES_CORE}" | grep -q 'libfreecad_files_core.so'
            echo "${ABI}: $(find "app/src/main/jniLibs/${ABI}" -type f -name '*.so' | wc -l) libraries"
          done

          cp .build/native-runtime/assets/licenses/FreeCAD-LGPL-2.1.txt \
            app/src/main/assets/licenses/FreeCAD-LGPL-2.1.txt
          test -s app/src/main/assets/licenses/FreeCAD-LGPL-2.1.txt

      - name: Build and run unit tests
        id: gradle-build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee build.log

      - name: Verify self-contained universal APK
        if: steps.gradle-build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "${APK}" > apk-contents.txt
          for ABI in armeabi-v7a arm64-v8a; do
            grep -q "lib/${ABI}/libfreecad_android_core.so" apk-contents.txt
            grep -q "lib/${ABI}/libfreecad_files_core.so" apk-contents.txt
            grep -q "lib/${ABI}/libTKDESTEP.so" apk-contents.txt
            grep -q "lib/${ABI}/libpython3.14.so" apk-contents.txt
            grep -q "assets/python-runtime/${ABI}.zip" apk-contents.txt
          done
          grep -q 'assets/licenses/FreeCAD-LGPL-2.1.txt' apk-contents.txt
          sha256sum "${APK}" | tee app-debug.apk.sha256

      - name: Package complete source project
        if: steps.gradle-build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project-archive
          git archive --format=zip --prefix=SolidFreeCAD-source/ \
            --output="project-archive/SolidFreeCAD-source-${GITHUB_SHA}.zip" HEAD
          cp "$(find .deps/freecad-base-runtime -type f -name '*.apk' | head -n 1)" \
            project-archive/FreeCAD-Android-Base-Runtime-v0.11.0.apk
          cp "$(find .deps/freecad-files-runtime -type f -name '*.apk' | head -n 1)" \
            project-archive/FreeCAD-Android-FCStd-Bridge.apk
          cp app/build/outputs/apk/debug/app-debug.apk \
            project-archive/SolidFreeCAD-v1.9-freecad-base-0110-gpu.apk
          cp build.log apk-contents.txt app-debug.apk.sha256 project-archive/
          cat > project-archive/README-BUNDLE.txt <<EOF
          SolidFreeCAD complete project bundle
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          FreeCAD-Native commit: ${FREECAD_BASE_RUNTIME_COMMIT}
          Includes source, FreeCAD Base runtime 0.11.0, object-aware FCStd bridge,
          ARM32/ARM64 APK, CPython, OCCT STEP, GPU VSYNC face preview and build logs.
          EOF

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SolidFreeCAD-build-log
          path: |
            build.log
            apk-contents.txt
            app-debug.apk.sha256
          if-no-files-found: warn

      - name: Upload debug APK
        if: steps.gradle-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SolidFreeCAD-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload complete project bundle
        if: steps.gradle-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SolidFreeCAD-complete-project
          path: project-archive/
          if-no-files-found: error

      - name: Propagate build failure
        if: steps.gradle-build.outcome == 'failure'
        run: exit 1
