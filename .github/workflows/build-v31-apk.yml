name: Build SolidFreeCAD v3.1 APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-v31:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Reconstruct and verify v3.1 source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-v31/chunk-* > /tmp/v31.b64
          base64 --decode /tmp/v31.b64 > /tmp/v31.zip
          echo '7eea8ab0ac331b9ed379e704a74e07dea5e282b5ec3c7ce94a98e7af9ec0343d  /tmp/v31.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/v31.zip') as archive:
              archive.extractall('.')
          PY
          test -s app/build.gradle.kts
          test -s app/src/main/java/com/medinaparra/freecadandroid/nativebridge/NativeStepBridge.kt
          rm -rf .agent-v31

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and ELF tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          sudo apt-get update
          sudo apt-get install -y patchelf binutils

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Download validated Move-capable FreeCAD runtime
        uses: actions/download-artifact@v4
        with:
          name: freecad-android-base-runtime-v0110-apk
          path: .deps/base-runtime
          repository: MedinaParra/FreeCAD-Native
          run-id: 29863306422
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download validated FCStd bridge
        uses: actions/download-artifact@v4
        with:
          name: freecad-android-fcmacro-fcstd-apk
          path: .deps/files-runtime
          repository: MedinaParra/FreeCAD-Native
          run-id: 29699041982
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package ARM32 and ARM64 native runtimes
        shell: bash
        run: |
          set -euo pipefail
          BASE_APK="$(find .deps/base-runtime -type f -name '*.apk' | head -n 1)"
          FILES_APK="$(find .deps/files-runtime -type f -name '*.apk' | head -n 1)"
          test -n "$BASE_APK" && test -n "$FILES_APK"
          rm -rf .build app/src/main/jniLibs app/src/main/assets/python-runtime app/src/main/assets/licenses
          mkdir -p .build/base .build/files app/src/main/jniLibs app/src/main/assets/python-runtime app/src/main/assets/licenses
          unzip -q "$BASE_APK" 'lib/armeabi-v7a/*' 'lib/arm64-v8a/*' 'assets/python-runtime/armeabi-v7a.zip' 'assets/python-runtime/arm64-v8a.zip' 'assets/licenses/FreeCAD-LGPL-2.1.txt' -d .build/base
          unzip -q "$FILES_APK" 'lib/armeabi-v7a/libfreecad_android_core.so' 'lib/arm64-v8a/libfreecad_android_core.so' -d .build/files
          for ABI in armeabi-v7a arm64-v8a; do
            mkdir -p "app/src/main/jniLibs/$ABI"
            cp .build/base/lib/$ABI/*.so "app/src/main/jniLibs/$ABI/"
            cp ".build/base/assets/python-runtime/$ABI.zip" "app/src/main/assets/python-runtime/$ABI.zip"
            cp ".build/files/lib/$ABI/libfreecad_android_core.so" "app/src/main/jniLibs/$ABI/libfreecad_files_core.so"
            patchelf --set-soname libfreecad_files_core.so "app/src/main/jniLibs/$ABI/libfreecad_files_core.so"
            nm -D --defined-only "app/src/main/jniLibs/$ABI/libfreecad_android_core.so" | grep -q nativePreviewMove
            test -f "app/src/main/jniLibs/$ABI/libTKBRep.so"
            test -f "app/src/main/jniLibs/$ABI/libTKDESTEP.so"
            test -f "app/src/main/jniLibs/$ABI/libpython3.14.so"
          done
          cp .build/base/assets/licenses/FreeCAD-LGPL-2.1.txt app/src/main/assets/licenses/FreeCAD-LGPL-2.1.txt

      - name: Compile APK and run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee build-v31.log

      - name: Verify universal APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" > apk-contents.txt
          for ABI in armeabi-v7a arm64-v8a; do
            grep -q "lib/$ABI/libfreecad_android_core.so" apk-contents.txt
            grep -q "lib/$ABI/libfreecad_files_core.so" apk-contents.txt
            grep -q "lib/$ABI/libTKBRep.so" apk-contents.txt
            grep -q "lib/$ABI/libTKDESTEP.so" apk-contents.txt
            grep -q "lib/$ABI/libpython3.14.so" apk-contents.txt
          done
          cp "$APK" SolidFreeCAD-v3.1.0-touch-workflows-a1-universal.apk
          sha256sum SolidFreeCAD-v3.1.0-touch-workflows-a1-universal.apk > SolidFreeCAD-v3.1.0-touch-workflows-a1-universal.apk.sha256

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: SolidFreeCAD-v3.1.0-touch-workflows-a1-universal
          path: |
            SolidFreeCAD-v3.1.0-touch-workflows-a1-universal.apk
            SolidFreeCAD-v3.1.0-touch-workflows-a1-universal.apk.sha256
            build-v31.log
          retention-days: 30
