name: Assemble v30 payload

on:
  push:
    branches:
      - agent/stage-solidfreecad-v30-payload

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          test -f .agent-payload/READY
          cat .agent-payload/chunk-* > /tmp/v30.b64
          base64 --decode /tmp/v30.b64 > /tmp/v30.zip
          echo '6e214c5115e476c3656863552b7a302d805f49513d28f7806a0b959dcfd6de6c  /tmp/v30.zip' | sha256sum -c -
          unzip -o /tmp/v30.zip -d .
          rm -rf .agent-payload
          rm -f .github/workflows/apply-v30-payload.yml
      - name: Commit assembled revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Assemble adaptive STEP editing payload'
          git push origin HEAD:agent/stage-solidfreecad-v30-payload
