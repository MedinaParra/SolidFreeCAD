name: Android build

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  FREECAD_BASE_RUNTIME_RUN: 29695398108
  FREECAD_BASE_RUNTIME_ARTIFACT: freecad-android-base-runtime-v091-apk
  FREECAD_BASE_RUNTIME_COMMIT: ac7cc2213aa26ed1526f522b5338b6a625fc9937

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Download validated FreeCAD Base runtime 0.9.1
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FREECAD_BASE_RUNTIME_ARTIFACT }}
          path: .deps/freecad-base-runtime
          repository: MedinaParra/FreeCAD-Native
          run-id: ${{ env.FREECAD_BASE_RUNTIME_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and package ARM32 plus ARM64 runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE_APK="$(find .deps/freecad-base-runtime -type f -name '*.apk' | head -n 1)"
          HASH_FILE="$(find .deps/freecad-base-runtime -type f -name '*.apk.sha256' | head -n 1)"
          test -n "${BASE_APK}"
          test -n "${HASH_FILE}"
          (
            cd "$(dirname "${BASE_APK}")"
            sha256sum -c "$(basename "${HASH_FILE}")"
          )

          rm -rf .build/native-runtime app/src/main/jniLibs \
            app/src/main/assets/python-runtime app/src/main/assets/licenses
          mkdir -p .build/native-runtime app/src/main/jniLibs \
            app/src/main/assets/python-runtime app/src/main/assets/licenses

          unzip -q "${BASE_APK}" \
            'lib/armeabi-v7a/*' \
            'lib/arm64-v8a/*' \
            'assets/python-runtime/armeabi-v7a.zip' \
            'assets/python-runtime/arm64-v8a.zip' \
            'assets/licenses/FreeCAD-LGPL-2.1.txt' \
            -d .build/native-runtime

          for ABI in armeabi-v7a arm64-v8a; do
            mkdir -p "app/src/main/jniLibs/${ABI}"
            cp .build/native-runtime/lib/${ABI}/*.so "app/src/main/jniLibs/${ABI}/"
            cp ".build/native-runtime/assets/python-runtime/${ABI}.zip" \
              "app/src/main/assets/python-runtime/${ABI}.zip"
            test -f "app/src/main/jniLibs/${ABI}/libfreecad_android_core.so"
            test -f "app/src/main/jniLibs/${ABI}/libTKDESTEP.so"
            test -f "app/src/main/jniLibs/${ABI}/libpython3.14.so"
            test -f "app/src/main/assets/python-runtime/${ABI}.zip"
            nm -D --defined-only "app/src/main/jniLibs/${ABI}/libfreecad_android_core.so" \
              | grep -q 'Java_com_medinaparra_freecadandroid_nativebridge_FreeCadBaseBridge_nativeSelfTest'
            nm -D --defined-only "app/src/main/jniLibs/${ABI}/libfreecad_android_core.so" \
              | grep -q 'Java_com_medinaparra_freecadandroid_nativebridge_NativeCadBridge_nativeRunMacro'
            nm -D --defined-only "app/src/main/jniLibs/${ABI}/libfreecad_android_core.so" \
              | grep -q 'Java_com_medinaparra_freecadandroid_nativebridge_NativeStepBridge_nativeImportStep'
            echo "${ABI}: $(find "app/src/main/jniLibs/${ABI}" -type f -name '*.so' | wc -l) libraries"
          done

          cp .build/native-runtime/assets/licenses/FreeCAD-LGPL-2.1.txt \
            app/src/main/assets/licenses/FreeCAD-LGPL-2.1.txt
          test -s app/src/main/assets/licenses/FreeCAD-LGPL-2.1.txt

      - name: Build and run unit tests
        id: gradle-build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee build.log

      - name: Verify self-contained universal APK
        if: steps.gradle-build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "${APK}" > apk-contents.txt
          for ABI in armeabi-v7a arm64-v8a; do
            grep -q "lib/${ABI}/libfreecad_android_core.so" apk-contents.txt
            grep -q "lib/${ABI}/libTKDESTEP.so" apk-contents.txt
            grep -q "lib/${ABI}/libpython3.14.so" apk-contents.txt
            grep -q "assets/python-runtime/${ABI}.zip" apk-contents.txt
          done
          grep -q 'assets/licenses/FreeCAD-LGPL-2.1.txt' apk-contents.txt
          sha256sum "${APK}" | tee app-debug.apk.sha256

      - name: Package complete source project
        if: steps.gradle-build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project-archive
          git archive --format=zip --prefix=SolidFreeCAD-source/ \
            --output="project-archive/SolidFreeCAD-source-${GITHUB_SHA}.zip" HEAD
          cp "$(find .deps/freecad-base-runtime -type f -name '*.apk' | head -n 1)" \
            project-archive/FreeCAD-Android-Base-Runtime-v0.9.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk \
            project-archive/SolidFreeCAD-v1.5-freecad-base-111.apk
          cp build.log apk-contents.txt app-debug.apk.sha256 project-archive/
          cat > project-archive/README-BUNDLE.txt <<EOF
          SolidFreeCAD complete project bundle
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          Base runtime commit: ${FREECAD_BASE_RUNTIME_COMMIT}
          Includes source archive, FreeCAD 1.1.1 Base runtime 0.9.1,
          ARM32/ARM64 universal APK, embedded CPython, OCCT STEP,
          initial FCStd support, macro compatibility, build log and SHA-256.
          EOF

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SolidFreeCAD-build-log
          path: |
            build.log
            apk-contents.txt
            app-debug.apk.sha256
          if-no-files-found: warn

      - name: Upload debug APK
        if: steps.gradle-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SolidFreeCAD-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload complete project bundle
        if: steps.gradle-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SolidFreeCAD-complete-project
          path: project-archive/
          if-no-files-found: error

      - name: Propagate build failure
        if: steps.gradle-build.outcome == 'failure'
        run: exit 1
