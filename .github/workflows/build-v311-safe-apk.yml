name: Build SolidFreeCAD v3.1.1 Safe Start APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-v311-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Reconstruct, verify and patch safe-start source
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-v31/chunk-* > /tmp/v31.b64
          base64 --decode /tmp/v31.b64 > /tmp/v31.zip
          echo '7eea8ab0ac331b9ed379e704a74e07dea5e282b5ec3c7ce94a98e7af9ec0343d  /tmp/v31.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile('/tmp/v31.zip') as archive:
              archive.extractall('.')

          touch_target = Path('app/src/main/java/com/example/faceui/CadSketchTouchV31.kt')
          touch_source = touch_target.read_text()
          touch_source = touch_source.replace(
              'fun modelDelta(dx: Float, dy: Float): Pair<Double, Double> = dx / scale to -dy / scale',
              'fun modelDelta(dx: Float, dy: Float): Pair<Double, Double> = (dx / scale).toDouble() to (-dy / scale).toDouble()',
              1,
          )
          touch_target.write_text(touch_source)

          test_target = Path('app/src/test/java/com/example/faceui/CadSketchTouchV31Test.kt')
          test_source = test_target.read_text().replace(
              'CadSketch.empty("S")',
              'CadSketch(id = 1L, label = "S", planeId = 1L)',
          )
          test_target.write_text(test_source)

          activity_target = Path('app/src/main/v27gen/SolidFreeCadWorkbenchActivityV27.part1')
          activity_source = activity_target.read_text()
          startup_old = '} else rebuild(history.reset(BasicCadProgram()), true, "Pieza paramétrica creada")'
          startup_new = '''} else {
status = "Inicio seguro activo · el núcleo CAD se cargará solo al abrir o crear un modelo"
}'''
          if startup_old not in activity_source:
              raise SystemExit('Safe-start startup target not found')
          activity_source = activity_source.replace(startup_old, startup_new, 1)
          new_old = 'onNew = { rebuild(history.reset(BasicCadProgram()), true, "Pieza paramétrica creada") },'
          new_new = 'onNew = { rebuild(history.reset(BasicCadProgram()), true, "Cargando núcleo CAD para crear una pieza…") },'
          if new_old not in activity_source:
              raise SystemExit('New document action target not found')
          activity_target.write_text(activity_source.replace(new_old, new_new, 1))

          gradle_target = Path('app/build.gradle.kts')
          gradle_source = gradle_target.read_text()
          gradle_source = gradle_source.replace('versionCode = 31', 'versionCode = 32', 1)
          gradle_source = gradle_source.replace(
              'versionName = "3.1.0-touch-workflows-a1"',
              'versionName = "3.1.1-samsung-safe-start-a1"',
              1,
          )
          gradle_target.write_text(gradle_source)

          manifest_target = Path('app/src/main/AndroidManifest.xml')
          manifest_source = manifest_target.read_text()
          if 'android:largeHeap="true"' not in manifest_source:
              manifest_source = manifest_source.replace(
                  'android:allowBackup="true"',
                  'android:allowBackup="true"\n        android:largeHeap="true"',
                  1,
              )
          manifest_target.write_text(manifest_source)
          PY
          test -s app/build.gradle.kts
          grep -q '3.1.1-samsung-safe-start-a1' app/build.gradle.kts
          grep -q 'Inicio seguro activo' app/src/main/v27gen/SolidFreeCadWorkbenchActivityV27.part1
          rm -rf .agent-v31

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and ELF tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          sudo apt-get update
          sudo apt-get install -y patchelf binutils

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Download validated Move-capable FreeCAD runtime
        uses: actions/download-artifact@v4
        with:
          name: freecad-android-base-runtime-v0110-apk
          path: .deps/base-runtime
          repository: MedinaParra/FreeCAD-Native
          run-id: 29863306422
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download validated FCStd bridge
        uses: actions/download-artifact@v4
        with:
          name: freecad-android-fcmacro-fcstd-apk
          path: .deps/files-runtime
          repository: MedinaParra/FreeCAD-Native
          run-id: 29699041982
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package ARM32 and ARM64 native runtimes
        shell: bash
        run: |
          set -euo pipefail
          BASE_APK="$(find .deps/base-runtime -type f -name '*.apk' | head -n 1)"
          FILES_APK="$(find .deps/files-runtime -type f -name '*.apk' | head -n 1)"
          test -n "$BASE_APK" && test -n "$FILES_APK"
          rm -rf .build app/src/main/jniLibs app/src/main/assets/python-runtime app/src/main/assets/licenses
          mkdir -p .build/base .build/files app/src/main/jniLibs app/src/main/assets/python-runtime app/src/main/assets/licenses
          unzip -q "$BASE_APK" 'lib/armeabi-v7a/*' 'lib/arm64-v8a/*' 'assets/python-runtime/armeabi-v7a.zip' 'assets/python-runtime/arm64-v8a.zip' 'assets/licenses/FreeCAD-LGPL-2.1.txt' -d .build/base
          unzip -q "$FILES_APK" 'lib/armeabi-v7a/libfreecad_android_core.so' 'lib/arm64-v8a/libfreecad_android_core.so' -d .build/files
          for ABI in armeabi-v7a arm64-v8a; do
            mkdir -p "app/src/main/jniLibs/$ABI"
            cp .build/base/lib/$ABI/*.so "app/src/main/jniLibs/$ABI/"
            cp ".build/base/assets/python-runtime/$ABI.zip" "app/src/main/assets/python-runtime/$ABI.zip"
            cp ".build/files/lib/$ABI/libfreecad_android_core.so" "app/src/main/jniLibs/$ABI/libfreecad_files_core.so"
            patchelf --set-soname libfreecad_files_core.so "app/src/main/jniLibs/$ABI/libfreecad_files_core.so"
            nm -D --defined-only "app/src/main/jniLibs/$ABI/libfreecad_android_core.so" | grep -q nativePreviewMove
            readelf -lW "app/src/main/jniLibs/$ABI/libfreecad_android_core.so" | grep 'LOAD' | grep -q '0x4000'
          done
          cp .build/base/assets/licenses/FreeCAD-LGPL-2.1.txt app/src/main/assets/licenses/FreeCAD-LGPL-2.1.txt

      - name: Compile safe-start APK and run tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee build-v311-safe.log

      - name: Verify universal safe-start APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" > apk-contents.txt
          for ABI in armeabi-v7a arm64-v8a; do
            grep -q "lib/$ABI/libfreecad_android_core.so" apk-contents.txt
            grep -q "lib/$ABI/libfreecad_files_core.so" apk-contents.txt
            grep -q "lib/$ABI/libTKBRep.so" apk-contents.txt
            grep -q "lib/$ABI/libTKDESTEP.so" apk-contents.txt
            grep -q "lib/$ABI/libpython3.14.so" apk-contents.txt
          done
          cp "$APK" SolidFreeCAD-v3.1.1-Samsung-A26-safe-start-universal.apk
          sha256sum SolidFreeCAD-v3.1.1-Samsung-A26-safe-start-universal.apk > SolidFreeCAD-v3.1.1-Samsung-A26-safe-start-universal.apk.sha256

      - name: Upload safe-start universal APK
        uses: actions/upload-artifact@v4
        with:
          name: SolidFreeCAD-v3.1.1-Samsung-A26-safe-start-universal
          path: |
            SolidFreeCAD-v3.1.1-Samsung-A26-safe-start-universal.apk
            SolidFreeCAD-v3.1.1-Samsung-A26-safe-start-universal.apk.sha256
            build-v311-safe.log
          retention-days: 30
